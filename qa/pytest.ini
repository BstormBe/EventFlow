[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --tracing retain-on-failure --screenshot only-on-failure --output reports/playwright
markers =
    smoke: tests rapides de sante
    api: tests d'API
    security: tests de securite (OWASP)
    db: tests de coherence base de donnees
    schema: validation de contrat JSON Schema
    ui: tests d'interface (Playwright)
    selenium: tests back-office (Selenium + Page Object Model)
